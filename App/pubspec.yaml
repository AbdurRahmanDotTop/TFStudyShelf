name: tf_study_shelf
description: "TF Study Shelf - Read. Learn. Remember. A free digital library and study companion."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core
  dio: ^5.4.0
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  go_router: ^14.8.1
  get_it: ^7.7.0
  google_mobile_ads: ^5.1.0

  # Firebase (Free tier - Spark plan)
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.3
  cloud_firestore: ^5.6.11
  firebase_messaging: ^15.2.5
  firebase_analytics: ^11.4.5
  firebase_crashlytics: ^4.3.5

  # Storage & Persistence
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.2
  sqflite: ^2.3.2

  # UI
  cached_network_image: ^4.0.0
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # PDF & Reader
  flutter_pdfview: ^1.3.2
  url_launcher: ^6.2.4
  share_plus: ^10.1.4

  # Utilities
  connectivity_plus: ^6.1.4
  intl: ^0.20.3
  logger: ^2.5.0
  package_info_plus: ^8.3.0
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.3
  flutter_launcher_icons: ^0.13.1


flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
